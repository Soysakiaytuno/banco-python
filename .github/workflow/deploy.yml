name: Deploy Banco

on: 
  push:
    branches: ["main", "desarrollo"]
  pull_request: 
    branches: ["main", desarrollo]

permissions:
  contents: write

jobs:
  build:
    name: Banco-Prestamo
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalacion
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Ejecutable
        run: |
          pyinstaller --onefile --windowed --name="Prestamos-Bancarios" main.py
      - name: Subir-Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prestamos-Bancarios
          path: dist/Prestamos-Bancarios.exe
      - name: Publicar-latest
        uses: ncipollo/release-action@v1
        with:
          artifacts: "dist/Prestamos-Bancarios.exe"
          tag: "latest"
          name: "Prestamos-Bancarios-Latest"
          allowUpdates: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}